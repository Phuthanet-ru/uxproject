<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechMart Seller — addproduct</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Mart</span><span style="font-size:10px;color:#6b86b8;font-weight:600;margin-left:4px;">SELLER</span></div>
  <input class="search" placeholder="Search products, orders...">
  <div class="seller-tag"><div class="avatar">🙂</div> TECH HOUSE</div>
</div>
<div class="nav">
  <a class="navlink" href="dashboard.html">Dashboard</a>
  <a class="navlink" href="products.html">Products</a>
  <a class="navlink" href="orders.html">Orders</a>
  <a class="navlink" href="chat.html">Chat</a>
  <a class="navlink" href="store.html">Store</a>
  <a class="navlink" href="analytics.html">Analytics</a>
  <a class="navlink" href="wallet.html">Wallet</a>
</div>

<main>
<section class="page active" id="addproduct">
<h1>Add Product</h1>
    <div class="stepper">
      <div class="dot active">1</div><span>Basic Info</span><div class="line"></div>
      <div class="dot">2</div><span>Images</span><div class="line"></div>
      <div class="dot">3</div><span>Specification</span><div class="line"></div>
      <div class="dot">4</div><span>Publish</span>
    </div>
    <div class="card" style="padding:22px;">
      <div class="form">
        <label>Product Name</label><input placeholder="e.g. RTX 5070 Gaming GPU">
        <div class="form-grid">
          <div><label>Category</label><select><option>GPU</option></select></div>
          <div><label>Brand</label><select><option>ASUS</option></select></div>
        </div>
        <label>Description</label><textarea rows="4" placeholder="Describe the product..."></textarea>
      </div>
      <div style="margin-top:18px;display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn-ghost">Save Draft</button>
        <button class="btn-primary">Continue</button>
      </div>
    </div>
</section>
</main>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
