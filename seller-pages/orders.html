<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seller — Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Mart</span><span style="font-size:10px;color:#6b86b8;font-weight:600;margin-left:4px;">SELLER</span></div>
  <input class="search" placeholder="Search products, orders...">
  <div class="seller-tag"><div class="avatar">🙂</div> TECH HOUSE</div>
</div>
<div class="nav">
  <a class="navlink" href="dashboard.html">Dashboard</a>
  <a class="navlink" href="products.html">Products</a>
  <a class="navlink active" href="orders.html">Orders</a>
  <a class="navlink" href="chat.html">Chat</a>
  <a class="navlink" href="store.html">Store</a>
  <a class="navlink" href="analytics.html">Analytics</a>
  <a class="navlink" href="wallet.html">Wallet</a>
</div>

<main>
<section class="page active" id="orders">
<h1>Orders</h1>
    <div class="tabs">
      <button class="active">Pending</button><button>Paid</button><button>Shipping</button><button>Done</button>
    </div>
    <div class="order-cols">
      <div class="order-col"><h3>Pending</h3>
        <div class="order-card"><div class="id">#10293</div>DDR5 16GB<div class="price">฿3,900</div><a>Detail</a></div>
      </div>
      <div class="order-col"><h3>Paid</h3>
        <div class="order-card" onclick="location.href='orderdetail.html'"><div class="id">#10291</div>RTX 5070 ×1<div class="price">฿29,900</div><a>Detail</a></div>
        <div class="order-card"><div class="id">#10290</div>DDR5 ×2<div class="price">฿7,800</div><a>Detail</a></div>
      </div>
      <div class="order-col"><h3>Shipping</h3>
        <div class="order-card"><div class="id">#10289</div>Ryzen 7<div class="price">฿12,900</div><a>Detail</a></div>
      </div>
      <div class="order-col"><h3>Done</h3>
        <div class="order-card"><div class="id">#10280</div>Mouse<div class="price">฿1,500</div><a>Detail</a></div>
      </div>
    </div>
</section>
</main>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
