<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechMart Seller — Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Mart</span><span style="font-size:10px;color:#6b86b8;font-weight:600;margin-left:4px;">SELLER</span></div>
  <input class="search" placeholder="Search products, orders...">
  <div class="seller-tag"><div class="avatar">🙂</div> TECH HOUSE</div>
</div>
<div class="nav">
  <a class="navlink" href="dashboard.html">Dashboard</a>
  <a class="navlink active" href="products.html">Products</a>
  <a class="navlink" href="orders.html">Orders</a>
  <a class="navlink" href="chat.html">Chat</a>
  <a class="navlink" href="store.html">Store</a>
  <a class="navlink" href="analytics.html">Analytics</a>
  <a class="navlink" href="wallet.html">Wallet</a>
</div>

<main>
<section class="page active" id="products">
<h1>My Products</h1>
    <div class="toolbar">
      <input placeholder="Search products">
      <div class="filters">
        <select><option>Category ▾</option></select>
        <select><option>Status ▾</option></select>
        <button class="btn-primary" onclick="location.href='addproduct.html'">+ Add Product</button>
      </div>
    </div>
    <div class="card">
      <table>
        <tr><th>Product</th><th>Price</th><th>Category</th><th>Stock</th><th>Status</th><th></th></tr>
        <tr style="cursor:pointer" onclick="location.href='productdetail.html'"><td>RTX 5070 Gaming GPU</td><td>฿29,900</td><td>GPU</td><td>5</td><td><span class="badge active">Active</span></td><td>⋮</td></tr>
        <tr><td>Ryzen 7 7800X3D</td><td>฿12,900</td><td>CPU</td><td>8</td><td><span class="badge active">Active</span></td><td>⋮</td></tr>
        <tr><td>RAM DDR5 16GB/6000MHz</td><td>฿3,900</td><td>RAM</td><td>12</td><td><span class="badge active">Active</span></td><td>⋮</td></tr>
        <tr><td>Wireless Mouse</td><td>฿1,500</td><td>Accessories</td><td>20</td><td><span class="badge active">Active</span></td><td>⋮</td></tr>
      </table>
    </div>
</section>
</main>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
