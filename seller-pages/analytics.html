<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TechMart Seller — Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/styles.css">
</head>
<body>

<div class="topbar">
  <div class="logo">Tech<span>Mart</span>
    <span style="font-size:10px;color:#6b86b8;font-weight:600;margin-left:4px;">SELLER</span>
  </div>
  <input class="search" placeholder="Search products, orders...">
  <div class="seller-tag"><div class="avatar">🙂
  </div> TECH HOUSE</div>
</div>
<div class="nav">
  <a class="navlink" href="dashboard.html">Dashboard</a>
  <a class="navlink" href="products.html">Products</a>
  <a class="navlink" href="orders.html">Orders</a>
  <a class="navlink" href="chat.html">Chat</a>
  <a class="navlink" href="store.html">Store</a>
  <a class="navlink active" href="analytics.html">Analytics</a>
  <a class="navlink" href="wallet.html">Wallet</a>
</div>

<main>
<section class="page active" id="analytics">
<h1>Sales Analytics</h1>
    <div class="stat-row" style="grid-template-columns:repeat(4,1fr);">
      <div class="card stat"><div class="label">
        Revenue
      </div>
      <div class="value">
        ฿125K
      </div>
    </div>
      <div class="card stat">
        <div class="label">
          Orders
        </div>
        <div class="value">
          245
        </div>
      </div>
      <div class="card stat">
        <div class="label">
          Products
        </div>
        <div class="value">
          58
        </div>
      </div>
      <div class="card stat">
        <div class="label">
          Avg Order
        </div>
        <div class="value">
          ฿3,200
        </div>
      </div>
    </div>
    <div class="card" style="padding:18px;margin-bottom:16px;">
      <div class="subtle" style="margin-bottom:10px;">
        Revenue Chart
      </div>
      <svg viewBox="0 0 400 100" width="100%" height="100">
        <polyline points="0,80 60,60 120,70 180,30 240,45 300,15 360,25 400,10" fill="none" stroke="#2F6FED" stroke-width="3"/>
      </svg>
    </div>
    <div class="card" style="padding:18px;">
      <div class="subtle" style="margin-bottom:6px;">
        Top Products
      </div>
      <div style="font-size:13.5px;">
        1. RTX 5070 &nbsp; 2. Ryzen 7 &nbsp; 3. DDR5 RAM
      </div>
    </div>
</section>
</main>

<script>
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
</body>
</html>
